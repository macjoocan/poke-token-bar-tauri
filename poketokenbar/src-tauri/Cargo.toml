[package]
name = "poketokenbar"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "poketokenbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core (tray-icon: 동적 트레이 아이콘, image-png: PNG 아이콘 로딩) ---
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"

# --- 직렬화 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- 코어 로직(파서/게임규칙/API) 공통 ---
dirs = "5"                # 홈 디렉토리 해석 (~/.claude 등) — macOS homeDirectoryForCurrentUser 대체
walkdir = "2"             # projects/**/*.jsonl 재귀 탐색
chrono = { version = "0.4", features = ["serde"] }  # ISO8601 타임스탬프
flate2 = "1"              # 사용량 캐시 스냅샷 zlib 압축
anyhow = "1"              # 에러 처리
thiserror = "1"

reqwest = { version = "0.12", features = ["blocking", "json"] }  # M2: OAuth 한도 / PokéAPI (blocking)

# --- M4: 자동시작(레지스트리 Run) + Windows 토스트 알림 ---
tauri-plugin-autostart = "2"       # 레지스트리 Run 자동시작
tauri-plugin-notification = "2"    # Windows 토스트 알림(한도 경고)

# --- 아래는 각 마일스톤에서 활성화 (선주석) ---
# tauri-plugin-store = "2"                                # 대안: companion-state 영속(현재 파일 직접)
# tauri-plugin-updater = "2"                              # M5: 인앱 업데이트
# keyring = "3"                                           # 후속: Windows 자격 증명 관리자

